# Logging (no lugar de printk)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

# Time slicing: sem isso, threads de MESMA prioridade nao se alternam
# e a condicao de corrida nao aparece. Fatia de 1 ms, aplicada a todas as
# threads preemptivas (prioridade >= 0).
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0

# Pilha da main (usa Logging)
CONFIG_MAIN_STACK_SIZE=2048